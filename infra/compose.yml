name: recruitops-middleware-demo
services:
  redis:
    image: redis:8.2.10-alpine
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory, 128mb, --maxmemory-policy, allkeys-lru]
    ports: ["127.0.0.1:16379:6379"]
    mem_limit: 192m
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms384m -Xmx384m
    ports: ["127.0.0.1:19200:9200"]
    mem_limit: 1g
    healthcheck:
      test: [CMD-SHELL, "curl --fail --silent http://localhost:9200/_cluster/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: [start-dev, --import-realm]
    profiles: [sso]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: demo-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${RECRUITOPS_KEYCLOAK_ADMIN_PASSWORD:?Set an ephemeral local admin password}
      KC_HOSTNAME: http://127.0.0.1:18180
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx384m
    ports: ["127.0.0.1:18180:8080"]
    mem_limit: 768m
    volumes: ["./recruitops-realm.json:/opt/keycloak/data/import/recruitops-realm.json:ro"]
