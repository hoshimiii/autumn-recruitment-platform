spring:
  datasource:
    url: jdbc:sqlite:./data/recruitment.sqlite
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
  flyway:
    locations: classpath:db/migration
server:
  address: ${RECRUITOPS_BIND_ADDRESS:127.0.0.1}
  error:
    whitelabel:
      enabled: false
recruitops:
  collector:
    user-agent: "${RECRUITOPS_USER_AGENT:AutumnRecruitmentBot/1.0}"
    connect-timeout-seconds: ${RECRUITOPS_CONNECT_TIMEOUT_SECONDS:10}
    minimum-floor-seconds: ${RECRUITOPS_MINIMUM_FLOOR_SECONDS:5}
    allow-private-addresses: ${RECRUITOPS_COLLECTOR_ALLOW_PRIVATE_ADDRESSES:false}
    daily-cron: "${RECRUITOPS_DAILY_CRON:0 0 8 * * *}"
    daily-timezone: "${RECRUITOPS_DAILY_TIMEZONE:Asia/Shanghai}"
