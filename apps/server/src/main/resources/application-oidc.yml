recruitops:
  collector:
    scheduler-enabled: false
  security:
    mode: oidc
    issuer-uri: ${RECRUITOPS_OIDC_ISSUER}
    audience: ${RECRUITOPS_OIDC_AUDIENCE}
    role-claim: ${RECRUITOPS_OIDC_ROLE_CLAIM:realm_access.roles}
    frontend-url: ${RECRUITOPS_OIDC_FRONTEND_URL:http://127.0.0.1:5173/}
spring:
  security:
    oauth2:
      client:
        registration:
          recruitops:
            provider: recruitops
            client-id: ${RECRUITOPS_OIDC_CLIENT_ID}
            client-secret: ${RECRUITOPS_OIDC_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope: openid,profile
        provider:
          recruitops:
            issuer-uri: ${RECRUITOPS_OIDC_ISSUER}
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
